    <!-- 4. El script principal de la animación -->
    <script>
        // --- DATOS (Corregidos con la lista de 13 ciudades) ---

        const cityData = {
            "Bogotá": { lat: 4.7110, lon: -74.0721 },
            "Medellín": { lat: 6.2442, lon: -75.5812 },
            "Cali": { lat: 3.4516, lon: -76.5320 },
            "Barranquilla": { lat: 10.9685, lon: -74.7813 },
            "Cartagena": { lat: 10.3910, lon: -75.4794 },
            "Bucaramanga": { lat: 7.1193, lon: -73.1227 },
            "Cúcuta": { lat: 7.8891, lon: -72.4965 },
            "Pereira": { lat: 4.8133, lon: -75.6961 },
            "Manizales": { lat: 5.0672, lon: -75.5174 },
            "Ibagué": { lat: 4.4389, lon: -75.2322 },
            "Santa Marta": { lat: 11.2408, lon: -74.1990 },
            "Villavicencio": { lat: 4.1420, lon: -73.6260 },
            "Neiva": { lat: 2.9273, lon: -75.2803 }
        };

        // Ruta corregida para incluir solo las 13 ciudades en un orden lógico
        const bestPathNames = [
            "Cúcuta", "Bucaramanga", "Santa Marta", "Barranquilla", "Cartagena", 
            "Medellín", "Manizales", "Pereira", "Ibagué", "Cali", "Neiva", 
            "Bogotá", "Villavicencio", "Cúcuta" // Vuelve al inicio para cerrar el ciclo
        ];
        
        // --- LÓGICA DEL MAPA Y LA ANIMACIÓN ---

        const routeCoordinates = bestPathNames.map(name => [cityData[name].lat, cityData[name].lon]);
        const map = L.map('map-container').setView([6.2, -74.5], 5);
        
        // Grupo de capas para controlar todos los elementos de la animación
        const animationLayerGroup = L.layerGroup().addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);
        
        // Ajusta el zoom para que toda la ruta sea visible
        map.fitBounds(L.polyline(routeCoordinates).getBounds().pad(0.1));

        /**
         * Crea un marcador personalizado para una ciudad.
         * @param {string} cityName - El nombre de la ciudad.
         * @param {number} order - El número de orden en la ruta.
         */
        function createMarker(cityName, order) {
            const city = cityData[cityName];
            const isStart = (order === 1);
            // El último marcador del ciclo no se muestra, así que no necesitamos una clase "end" especial
            const iconHtml = `<div class="custom-icon-div ${isStart ? 'start-end-icon' : ''}">${order}</div>`;
            const customIcon = L.divIcon({
                html: iconHtml,
                className: '', // Evita clases por defecto de Leaflet
                iconSize: [30, 30],
                iconAnchor: [15, 30]
            });

            L.marker([city.lat, city.lon], { icon: customIcon, zIndexOffset: 1000 })
                .bindPopup(`<b>${order}. ${cityName}</b>`)
                .addTo(animationLayerGroup); // Añadir al grupo de capas
        }
        
        let currentSegment = 0;
        const animationDelay = 1200; // Tiempo en milisegundos entre cada segmento

        /**
         * Dibuja el siguiente segmento de la ruta animada.
         */
        function drawNextSegment() {
            // Si la animación terminó, programa el reinicio
            if (currentSegment >= routeCoordinates.length - 1) {
                setTimeout(startAnimation, 3000); // Espera 3 segundos antes de reiniciar
                return;
            }

            const segmentCoords = [routeCoordinates[currentSegment], routeCoordinates[currentSegment + 1]];
            const destinationCityName = bestPathNames[currentSegment + 1];

            // Dibuja la línea del segmento
            const polyline = L.polyline(segmentCoords, { color: "#e31a1c", weight: 4, opacity: 0.8 })
                .addTo(animationLayerGroup); // Añadir al grupo de capas

            // Añade una flecha animada a la línea
            L.polylineDecorator(polyline, {
                patterns: [{
                    offset: '0%',
                    repeat: 100,
                    symbol: L.Symbol.arrowHead({
                        pixelSize: 12,
                        polygon: false,
                        pathOptions: { stroke: true, weight: 1, color: "#FFFFFF" }
                    })
                }]
            }).addTo(animationLayerGroup); // Añadir al grupo de capas

            // Crea el marcador para la ciudad de destino, si no es el punto final que se repite
            if (currentSegment < bestPathNames.length - 2) {
                createMarker(destinationCityName, currentSegment + 2);
            }

            currentSegment++;
            setTimeout(drawNextSegment, animationDelay);
        }
        
        /**
         * Inicia o reinicia la animación completa.
         * Limpia el mapa y comienza desde el principio.
         */
        function startAnimation() {
            animationLayerGroup.clearLayers(); // Limpia todos los elementos de la animación anterior
            currentSegment = 0; // Reinicia el contador de segmentos
            createMarker(bestPathNames[0], 1); // Pone el primer marcador
            drawNextSegment(); // Comienza la secuencia de dibujo de nuevo
        }

        // Iniciar la animación por primera vez cuando la página carga
        startAnimation();

    </script>
